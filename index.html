<!doctype html>
<html lang="en">
  <head>
    <!-- Meta Information for Character Set and Title -->
    <meta charset="UTF-8" />
    <title>Agile Flow</title>

    <!-- Meta Description and Viewport Configuration -->
    <meta
      name="description"
      content="AgileFlow is a B2B, SaaS-based project management system designed to streamline agile workflows, enhance collaboration, and boost productivity." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#ffffff" />
    <meta
      name="author"
      content="Aswini" />
    <meta
      name="keywords"
      content="project management, agile workflows, task management, sprint planning, real-time tracking, productivity, collaboration, SaaS, B2B, jira" />

    <!-- Open Graph Metadata for Social Media Sharing -->
    <meta
      property="og:title"
      content="Agile Flow" />
    <meta
      property="og:description"
      content="AgileFlow is a B2B, SaaS-based project management system designed to streamline agile workflows, enhance collaboration, and boost productivity." />
    <!-- Image in public folder -->
    <meta
      property="og:image"
      content="/images/og-image.jpg" />
    <meta
      property="og:url"
      content="https://agile-flow.com" />

    <!-- Twitter Card Metadata for Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Agile Flow" />
    <meta
      name="twitter:description"
      content="AgileFlow is a B2B, SaaS-based project management system designed to streamline agile workflows, enhance collaboration, and boost productivity." />
    <!-- Image in public folder -->
    <meta
      name="twitter:image"
      content="/images/twitter-image.jpg" />

    <!-- Robots Meta Tag for Search Engine Indexing -->
    <meta
      name="robots"
      content="index, follow" />

    <!-- Canonical Link to Avoid Duplicate Content -->
    <link
      rel="canonical"
      href="https://agile-flow.com/preferred-page" />

    <!-- Favicon and Icons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any" />
    <link
      rel="icon"
      href="/icon.svg"
      type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png" />
    <link
      rel="manifest"
      href="/site.webmanifest" />
    <meta
      name="msapplication-TileColor"
      content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"></script>
  </body>
</html>
